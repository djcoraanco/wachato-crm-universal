<!doctype html>

<body style="margin:0">
<title>Wachato CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — sidebar de módulos + área de trabajo; marca oscura con acento turquesa del logo */
:root{
  --bg:#0D1920; --panel:#13222B; --panel2:#1A2E39; --line:#243C4A; --fg:#E6F0F2; --muted:#8BA4AE;
  --accent:#00C4C0; --accent-soft:rgba(0,196,192,.14); --on-accent:#03201F;
  --wa:#25D366; --ig:#EA4F86; --fb:#5B97F7; --ok:#3BD38A; --warn:#F2B544; --bad:#F2706B;
  --bubble-in:#1E3542; --bubble-out:#0B514E; --bubble-ai:#173F4A;
  --display:"Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF4F5; --panel:#FFFFFF; --panel2:#F3F8F9; --line:#D3E1E5; --fg:#0D1D25; --muted:#587079;
  --accent:#009C98; --accent-soft:rgba(0,156,152,.12); --on-accent:#FFFFFF;
  --wa:#15A34A; --ig:#C92A63; --fb:#1D64D8; --ok:#16955A; --warn:#A87405; --bad:#C7413B;
  --bubble-in:#E7F0F2; --bubble-out:#CFF1EE; --bubble-ai:#DDEFF6; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EEF4F5; --panel:#FFFFFF; --panel2:#F3F8F9; --line:#D3E1E5; --fg:#0D1D25; --muted:#587079;
  --accent:#009C98; --accent-soft:rgba(0,156,152,.12); --on-accent:#FFFFFF;
  --wa:#15A34A; --ig:#C92A63; --fb:#1D64D8; --ok:#16955A; --warn:#A87405; --bad:#C7413B;
  --bubble-in:#E7F0F2; --bubble-out:#CFF1EE; --bubble-ai:#DDEFF6; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:900} h2{font-size:17px;font-weight:800} h3{font-size:14px;font-weight:800}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:20px 12px;overflow:auto}
.logo{display:flex;align-items:center;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.02em;padding:0 10px 18px;color:var(--fg);line-height:1}
.logo svg{width:.95em;height:.95em;margin-left:.02em;transform:translateY(.1em)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav a:hover{background:var(--panel2);color:var(--fg)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav .count{font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 7px;font-weight:700}
.navsep{height:1px;background:var(--line);margin:10px 8px}
.biz{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:2px}

main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.topbar h1{font-size:20px}
.demo{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 10px;font-weight:600}
.spacer{flex:1}
.view{flex:1;overflow:auto;padding:20px}
.view.flush{padding:0;overflow:hidden}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:99px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor;background:transparent}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.chip.bad{color:var(--bad);border-color:currentColor;background:transparent}
.chip.acc{color:var(--accent);border-color:currentColor;background:transparent}
.ch{display:inline-grid;place-items:center;min-width:26px;height:18px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;padding:0 4px}
.ch.wa{background:var(--wa)} .ch.ig{background:var(--ig)} .ch.fb{background:var(--fb)}
.toggle{position:relative;width:38px;height:22px;flex:none;appearance:none;background:var(--line);border-radius:99px;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .2s}
.toggle:checked{background:var(--accent)} .toggle:checked::after{transform:translateX(16px);background:var(--on-accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:6px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--panel2);border:1px solid var(--line);flex:none;font-size:13px}

/* Bandeja */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:100%}
.inbox>section{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.list{border-right:1px solid var(--line);background:var(--panel)}
.list .filters{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chats{overflow:auto;flex:1}
.chatitem{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:3px solid transparent;border-top:0;border-right:0}
.chatitem:hover{background:var(--panel2)}
.chatitem.on{background:var(--accent-soft);border-left-color:var(--accent)}
.chatitem .body{min-width:0;flex:1;display:grid;gap:3px}
.chatitem .top{display:flex;justify-content:space-between;gap:6px}
.chatitem .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatitem .prev{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.conv{background:var(--bg)}
.convhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.back{display:none}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.msg.in{background:var(--bubble-in);align-self:flex-start;border-bottom-left-radius:4px}
.msg.agent{background:var(--bubble-out);align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:var(--bubble-ai);align-self:flex-end;border-bottom-right-radius:4px;border:1px solid var(--accent-soft)}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;max-width:90%;text-align:center}
.typing{align-self:flex-end;color:var(--muted);font-size:12px}
.composer{border-top:1px solid var(--line);padding:12px;background:var(--panel);display:grid;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.window{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px}
.window.open{color:var(--ok);background:var(--accent-soft)}
.window.closed{color:var(--bad);border:1px solid var(--bad)}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.kv{display:grid;gap:3px}

/* Pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;min-height:100%}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:300px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.colhead{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.colhead select{padding:4px 8px;font-size:12px}
.cards{padding:10px;display:grid;gap:8px;align-content:start;flex:1}
.deal{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:6px;cursor:grab}
.deal:active{cursor:grabbing}
.deal select{padding:3px 6px;font-size:12px}

/* Tabla */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--panel2)}

/* Automatizaciones */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.step{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.step.trig{border-color:var(--accent);color:var(--accent);font-weight:600}
.arrow{color:var(--muted)}

/* Calendario */
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:56px repeat(6,minmax(110px,1fr));min-width:720px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.cal .dh{padding:10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-weight:700}
.cal .dh.today{color:var(--accent)}
.cal .hours{display:grid}
.cal .hr{height:52px;font-size:11px;color:var(--muted);padding:2px 8px;text-align:right;border-bottom:1px solid var(--line)}
.cal .day{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0 51px,var(--line) 51px 52px)}
.appt{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 7px;font-size:12px;background:var(--accent-soft);border-left:3px solid var(--accent);overflow:hidden}
.appt b{display:block}
.appt.new{animation:pop .6s ease}
@keyframes pop{from{transform:scale(.9);opacity:.3}}

/* Estadísticas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{display:grid;gap:4px}
.kpi .big{font-family:var(--display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600;color:var(--ok)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:180px;border-bottom:1px solid var(--line);background-image:linear-gradient(to top,var(--line) 1px,transparent 1px);background-size:100% 25%}
.bar{display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-width:0}
.bar span{display:block}
.xlab{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;font-size:10px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.ftrack{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
.ffill{height:100%;background:var(--accent);border-radius:6px}

/* Entrenar IA */
.train{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.tester{position:sticky;top:0;display:flex;flex-direction:column;height:min(660px,calc(100vh - 140px));padding:0;overflow:hidden}
.tester .msgs{padding:14px}
.tester .msg{max-width:88%}
.tester form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.tries{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.stepnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;flex:none}
.meter{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qa{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.drop{border:1.5px dashed var(--line);border-radius:11px;padding:18px;text-align:center;display:grid;gap:4px;cursor:pointer}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
@media (max-width:1100px){.train{grid-template-columns:1fr}.tester{position:static;height:540px}}


pre{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;font-size:12px;margin:0}

.toast{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:20;max-width:min(380px,calc(100vw - 32px))}
.toast div{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13px;animation:pop .3s ease}

@media (max-width:1100px){.inbox{grid-template-columns:270px minmax(0,1fr)}.inbox .side{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
  aside{flex-direction:row;align-items:center;overflow-x:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .logo{font-size:24px;padding:0 10px 0 0}
  nav{flex-direction:row}
  .navsep,.biz{display:none}
  main{overflow:visible}
  .view{overflow:visible;padding:16px}
  .topbar{padding:12px 16px}
  .view.flush{overflow:visible}
  .inbox{grid-template-columns:1fr;height:auto}
  .inbox .conv{display:none;min-height:75vh}
  .inbox.chat .list{display:none}
  .inbox.chat .conv{display:flex}
  .inbox.chat .side{display:grid;border-left:0;border-top:1px solid var(--line)}
  .back{display:inline-block}
  .msg{max-width:88%}
  .frow{grid-template-columns:90px 1fr 50px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside>
    <div class="logo" aria-label="wachato">wachat<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="54" cy="44" r="32" fill="none" stroke="var(--accent)" stroke-width="20"/><path d="M22 60 L12 96 L44 78 Z" fill="var(--accent)"/></svg></div>
    <nav id="nav"></nav>
    <div class="navsep"></div>
    <div class="biz"><span class="label">Negocio</span><b id="bizName"></b><span class="muted" style="font-size:12px">Santo Domingo</span></div>

  <main>

    <div class="view" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<script>

  {id:'nuevo',n:'Nuevo lead',ev:'Lead'},{id:'calificado',n:'Calificado',ev:'Contact'},
  {id:'cita',n:'Cita agendada',ev:'Schedule'},{id:'asistio',n:'Asistió',ev:''},
  {id:'cliente',n:'Cliente',ev:'Purchase'},{id:'perdido',n:'Perdido',ev:''}];
const stageName=id=>STAGES.find(s=>s.id===id).n;

const BIZ={
  name:'Clínica Bella Piel', rubro:'Clínica estética',
  address:'Av. Winston Churchill #93, Piantini, Santo Domingo',
  hours:'Lunes a viernes de 9:00 a. m. a 6:00 p. m. y sábados de 9:00 a. m. a 1:00 p. m.',
  tone:'Cercano y profesional, tutea al cliente, usa pocos emojis',
  services:[

    {n:'Botox (por zona)',p:8500,k:['botox','arruga','frente','patas de gallo']},
    {n:'Relleno con ácido hialurónico',p:15000,k:['relleno','labio','hialur']},
    {n:'Depilación láser (sesión)',p:4500,k:['láser','laser','depila']},
    {n:'Peeling químico',p:5000,k:['peeling','mancha']}],

  qa:[
    {q:'¿Cuántas sesiones de láser necesito?',k:'sesiones, cuántas veces',a:'Normalmente entre 6 y 8 sesiones, una cada 4 a 6 semanas. En la evaluación gratis te decimos el número exacto para tu caso.'},

  docs:[{n:'Catalogo_tratamientos_2026.pdf',frag:24},{n:'Politicas_de_cancelacion.docx',frag:6}]
};

let contacts=[
 {id:1,name:'María Fernández',ch:'wa',handle:'+1 809-555-0187',stage:'calificado',tags:['Botox','Anuncio'],origin:'Anuncio Click-to-WhatsApp «Botox noviembre»',value:8500,ai:true,unread:2,msgs:[
   ['in','¡Hola! Vi el anuncio del botox, ¿cuánto cuesta?',ago(.7)],
   ['ai','¡Hola, María! El botox está en RD$ 8,500 por zona e incluye la evaluación. ¿Qué zona te gustaría tratar?',ago(.69)],
   ['in','La frente y las patas de gallo',ago(.3)],
   ['in','¿Tienen disponibilidad esta semana?',ago(.25)]]},
 {id:2,name:'José Rodríguez',ch:'ig',handle:'@joserodz.do',stage:'nuevo',tags:['Láser'],origin:'Comentó «PRECIO» en un reel',value:4500,ai:true,unread:1,msgs:[
   ['sys','Automatización: comentario con «PRECIO» → DM enviado',ago(1.2)],
   ['ai','¡Hola, José! Gracias por comentar. La depilación láser está en RD$ 4,500 por sesión. ¿Para qué zona sería?',ago(1.2)],
   ['in','Para la espalda. ¿Cuántas sesiones hacen falta?',ago(1)]]},
 {id:3,name:'Ana Martínez',ch:'fb',handle:'Ana Martínez',stage:'cita',tags:['Rellenos'],origin:'Mensaje desde la página de Facebook',value:15000,ai:true,unread:0,msgs:[
   ['in','Buenas, quisiera agendar para rellenos de labios',ago(5)],

function toast(html){const d=document.createElement('div');d.innerHTML=html;$('#toast').append(d);setTimeout(()=>d.remove(),4200)}
function lastIn(c){const m=[...c.msgs].reverse().find(m=>m[0]==='in');return m?m[2]:0}
function windowInfo(c){const left=24*H-(Date.now()-lastIn(c));if(left<=0)return {open:false,txt:'Ventana de 24 h cerrada'};const h=Math.floor(left/H),m=Math.floor(left%H/60000);return {open:true,txt:`Ventana abierta · quedan ${h} h ${m} min`}}
function when(t){const d=(Date.now()-t)/60000;if(d<1)return 'ahora';if(d<60)return `hace ${Math.round(d)} min`;if(d<1440)return `hace ${Math.round(d/60)} h`;return `hace ${Math.round(d/1440)} d`}

  else toast(`${esc(c.name)} → <b>${st.n}</b>`);
}
function book(c,d,h){appts.push({d,h,dur:1,name:c.name,svc:c.tags[0]||'Evaluación',by:'IA',new:true});setStage(c,'cita');toast(`<b>Cita creada en Google Calendar</b><br><span class="muted">${esc(c.name)} · ${DAYS[d]} · ${h>12?h-12+':00 p. m.':h+':00 a. m.'}</span>`)}

// shortcut: respuestas por palabras clave para el prototipo; la versión funcional usa un modelo de IA con este mismo conocimiento
function aiReply(c,text,test){
  const t=text.toLowerCase();
  const h=agent.handoff;
  if((h.persona&&/persona|humano|asesor|alguien/.test(t))||(h.queja&&/queja|reclamo|molest/.test(t))||(h.medica&&/embaraz|alerg|medicament|enfermedad/.test(t))){
    if(!test)c.ai=false;return {r:'Claro, te paso con una persona del equipo. Te escribe en unos minutos.',sys:'La IA pasó la conversación a un humano.',src:'Reglas de paso a humano'};}
  if(/viernes|vie\b/.test(t)){if(!test)book(c,4,15);return {r:'¡Listo! Quedaste agendada el viernes 13 a las 3:00 p. m. en Piantini. Te enviaremos un recordatorio un día antes.',src:'Google Calendar'}}
  if(/s[aá]bado/.test(t)){if(!test)book(c,5,11);return {r:'¡Listo! Quedaste agendada el sábado 14 a las 11:00 a. m. Te enviaremos un recordatorio un día antes.',src:'Google Calendar'}}
  const qa=BIZ.qa.find(q=>q.k.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).some(k=>t.includes(k)));
  if(qa&&qa.a.trim())return {r:qa.a,src:'Preguntas y respuestas'};
  const svc=BIZ.services.find(s=>s.n&&[...s.k,s.n.toLowerCase()].some(k=>t.includes(k)));
  if(/promo|descuento|oferta/.test(t))return {r:'En noviembre tenemos 15 % de descuento en botox. ¿Te gustaría agendar tu evaluación gratis?',src:'Instrucciones'};
  if(/cita|agenda|disponib|turno|cu[aá]ndo|semana/.test(t))return {r:'Tengo disponible el viernes 13 a las 3:00 p. m. o el sábado 14 a las 11:00 a. m. ¿Cuál te queda mejor?',src:'Google Calendar (horas libres)'};
  if(/precio|cu[aá]nto|cuesta|costo|vale/.test(t))return {r:svc?`${svc.n}: RD$ ${fmt(svc.p)}. ¿Te gustaría agendar una evaluación?`:'Nuestros precios:\n'+BIZ.services.map(s=>`• ${s.n}: RD$ ${fmt(s.p)}`).join('\n')+'\n¿Cuál te interesa?',src:'Servicios y precios'};
  if(/d[oó]nde|ubica|direcci/.test(t))return {r:`Estamos en ${BIZ.address}.`,src:'Información del negocio'};
  if(/horario|abren|cierran|hora/.test(t))return {r:`Nuestro horario: ${BIZ.hours}.`,src:'Información del negocio'};
  if(/pago|tarjeta|transfer|parqueo/.test(t))return {r:BIZ.faq,src:'Información del negocio'};
  if(svc)return {r:`¡Buena elección! ${svc.n} está en RD$ ${fmt(svc.p)}. ¿Quieres que te busque un espacio esta semana?`,src:'Servicios y precios'};
  return {r:'¡Gracias por escribirnos! ¿Qué tratamiento te interesa? Tenemos '+BIZ.services.map(s=>s.n.toLowerCase()).join(', ')+'.',src:'Servicios y precios'};
}

const LIB={x:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',p:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',t:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'};
const libs={};
const loadJs=src=>libs[src]??=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete libs[src];ko(new Error('no se pudo cargar la librería, revisa tu conexión'))};document.head.append(s)});
async function saveFile(filename,data){
  if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click();return}
  const dl=await window.claude.use('downloads');
  if(!dl)return toast('Las descargas no están disponibles en esta vista.');
  try{await dl.save({filename,data});toast(`Descargado: <b>${esc(filename)}</b>`)}
  catch(e){if(e.code!=='declined')toast('No se pudo descargar: '+esc(e.message||e.code))}
}
const HEAD=['Nombre','Teléfono / usuario','Canal','Etapa','Etiquetas','Origen','Valor (RD$)','Último mensaje'];
const rowOf=c=>[c.name,c.handle,CH[c.ch].n,stageName(c.stage),c.tags.join(', '),c.origin,c.value,new Date(c.msgs.at(-1)[2]).toLocaleString('es-DO')];
async function exportContacts(kind){
  const rows=filtered().map(rowOf);if(!rows.length)return toast('No hay contactos con esos filtros.');
  const name=`contactos-wachato-${new Date().toISOString().slice(0,10)}`;
  try{
    if(kind==='x'){
      await loadJs(LIB.x);
      const ws=XLSX.utils.aoa_to_sheet([HEAD,...rows]);ws['!cols']=[22,18,11,14,18,42,12,20].map(wch=>({wch}));
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Contactos');
      await saveFile(name+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}));
    }else{
      await loadJs(LIB.p);await loadJs(LIB.t);
      const doc=new jspdf.jsPDF({orientation:'landscape'});
      doc.setFontSize(16);doc.text(`Contactos · ${BIZ.name}`,14,16);
      doc.setFontSize(9);doc.setTextColor(110);doc.text(`Exportado desde Wachato el ${new Date().toLocaleDateString('es-DO')} · ${rows.length} contactos`,14,22);
      doc.autoTable({head:[HEAD],body:rows.map(r=>r.map((v,i)=>i===6?'RD$ '+fmt(v):v)),startY:27,styles:{fontSize:8},headStyles:{fillColor:[0,156,152]}});
      await saveFile(name+'.pdf',doc.output('arraybuffer'));
    }
  }catch(e){toast('No se pudo generar el archivo: '+esc(e.message))}
}

  if(t.dataset.delqa){BIZ.qa.splice(+t.dataset.delqa,1);render();return}
  if(t.dataset.deldoc){BIZ.docs.splice(+t.dataset.deldoc,1);render();return}
  if(t.id==='readWeb'){const u=$('#webUrl').value.trim();if(!/^https?:\/\/\S+\.\S+/.test(u))return toast('Escribe una dirección web completa, por ejemplo https://tunegocio.com');BIZ.docs.push({n:u.replace(/^https?:\/\//,'')+' (sitio web, 12 páginas)',frag:38});render();toast('Sitio web leído y añadido al conocimiento de la IA');return}
  if(t.id==='resetTest'){S.test=[];renderTester();return}
  if(t.dataset.try)return testSend(t.dataset.try);
  if(t.dataset.chat){S.chat=+t.dataset.chat;S.mobileChat=true;contacts.find(c=>c.id===S.chat).unread=0;render()}
  else if(t.dataset.filter){S.filter=t.dataset.filter;render()}
  else if(t.dataset.as){S.as=t.dataset.as;render()}
  else if(t.hasAttribute('data-back')){S.mobileChat=false;render()}
  else if(t.id==='sendTpl'){const c=contacts.find(x=>x.id===S.chat),n=$('#tplSel').value;c.msgs.push(['agent',`[Plantilla ${n}] ¡Hola, ${c.name.split(' ')[0]}! Esta semana tenemos 15 % de descuento en tu tratamiento. ¿Te agendo?`,Date.now()]);c.msgs.push(['sys','Plantilla enviada. Meta cobra esta conversación según la categoría de la plantilla.',Date.now()]);render()}
  else if(t.id==='bookBtn'){const c=contacts.find(x=>x.id===S.chat);book(c,4,15);c.msgs.push(['sys','Cita creada: viernes 13 a las 3:00 p. m.',Date.now()]);render()}
  else if(t.id==='saveKey'){
    const v=$('#aiKey').value.trim(),pv=PROV[agent.ai.prov];
    if(v.length<20)toast('La clave parece incompleta. Cópiala entera desde el panel del proveedor.');
    else if(pv.pre&&!v.startsWith(pv.pre))toast(`Esa clave no parece de ${pv.n}: debería empezar por «${pv.pre}».`);
    else{agent.ai.keys[agent.ai.prov]=v.slice(0,pv.pre.length||3)+'…'+v.slice(-4);render();toast(`<b>Clave de ${pv.n} conectada</b><br><span class="muted">Verificación simulada en el prototipo</span>`)}}
  else if(t.id==='delKey'){delete agent.ai.keys[agent.ai.prov];render();toast('Clave quitada')}
  else if(t.id==='newAuto')toast('En el prototipo las automatizaciones son de ejemplo. El editor visual va en la versión funcional.');
  else if(t.id==='testHook'){$('#hookRes').innerHTML='<span class="muted">Probando…</span>';setTimeout(()=>{agent.tested='<span class="chip ok">Respondió 200 OK en 412 ms (simulado)</span>';$('#hookRes').innerHTML=agent.tested},800)}
  else if(t.dataset.open){S.chat=+t.dataset.open;S.mobileChat=true;location.hash='bandeja'}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='tsend'){e.preventDefault();const i=$('#tInput'),v=i.value.trim();if(v){i.value='';testSend(v)}return}
  if(e.target.id!=='send')return;e.preventDefault();const v=$('#msgInput').value.trim();if(v)sendMsg(v)});
document.addEventListener('change',e=>{
  const t=e.target,c=contacts.find(x=>x.id===S.chat);
  if(t.id==='aiToggle'){c.ai=t.checked;c.msgs.push(['sys',t.checked?'La IA vuelve a responder esta conversación.':'Un humano tomó la conversación. La IA queda en pausa.',Date.now()]);render()}
  else if(t.id==='stageSel'){setStage(c,t.value);render()}
  else if(t.dataset.move){setStage(contacts.find(x=>x.id==t.dataset.move),t.value);render()}
  else if(t.dataset.ev!==undefined){STAGES.find(s=>s.id===t.dataset.ev).ev=t.value;toast(`Etapa «${stageName(t.dataset.ev)}» enviará: <b>${t.value||'ningún evento'}</b>`)}
  else if(t.dataset.auto){autos[+t.dataset.auto].on=t.checked;toast(`${autos[+t.dataset.auto].name}: <b>${t.checked?'activada':'pausada'}</b>`)}
  else if(t.name==='mode'){agent.mode=t.value;render()}
  else if(t.id==='aiProv'){agent.ai.prov=t.value;agent.ai.model=PROV[t.value].models[0]?.[0]||'nombre-del-modelo';render()}
  else if(t.id==='aiModel'){agent.ai.model=t.value;toast(`El agente ahora usa <b>${esc(t.value)}</b>`)}
  else if(t.id==='aiBase'){agent.ai.base=t.value}
  else if(t.dataset.ho){agent.handoff[t.dataset.ho]=t.checked}
  else if(['fStage','fCh','fTag'].includes(t.id))renderRows();
  else if(t.id==='docsIn'){for(const f of t.files)BIZ.docs.push({n:f.name,frag:Math.max(1,Math.ceil(f.size/4000))});if(t.files.length)toast(`${t.files.length} documento(s) añadidos al conocimiento de la IA`);render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q')renderRows();
  else if(t.dataset.biz){BIZ[t.dataset.biz]=t.value;if(t.dataset.biz==='name')$('#bizName').textContent=t.value;updScore()}
  else if(t.dataset.svc){const s=BIZ.services[+t.dataset.svc];s[t.dataset.k]=t.dataset.k==='p'?+t.value:t.value;updScore()}
  else if(t.dataset.qa){BIZ.qa[+t.dataset.qa][t.dataset.k]=t.value;updScore()}
  else if(t.id==='agName')agent.name=t.value;
  else if(t.id==='agTone')BIZ.tone=t.value;
  else if(t.id==='hookUrl')agent.url=t.value;
});
/* arrastrar y soltar en el pipeline */
document.addEventListener('dragstart',e=>{const d=e.target.closest?.('[data-deal]');if(d)e.dataTransfer.setData('text/plain',d.dataset.deal)});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('[data-col]');if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-col]');if(!c)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');setStage(contacts.find(x=>x.id==id),c.dataset.col);render()});
document.addEventListener('dragend',()=>document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over')));

route();
</script>

</body>
</html>
